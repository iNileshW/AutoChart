[project]
name = "autochart"
version = "0.1.0"
description = "UKHO chart comparison chatbot + API + MCP tools"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "iNileshW", email = "33792419+iNileshW@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.1",
    "geodatasets>=2026.5.1",
    "geopandas>=1.1.4",
    "matplotlib>=3.11.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "pandas>=3.0.5",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "ruff>=0.16.1",
    "sentry-sdk[fastapi]>=2.66.1",
    "structlog>=26.1.0",
    "uvicorn>=0.35.0",
]

[project.scripts]
autochart = "autochart.cli:main"
autochart-api = "autochart.backend_runner:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "mypy>=2.3.0",
    "nbconvert>=7.17.1",
    "nbstripout>=0.9.1",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=autochart --cov-report=term-missing --cov-fail-under=75"

[tool.coverage.run]
branch = true
source = ["src/autochart"]
omit = ["src/autochart/cli.py", "src/autochart/backend_runner.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["notebook.ipynb", ".venv", "frontend/node_modules"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = []

[tool.mypy]
python_version = "3.13"
files = ["src/autochart"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
