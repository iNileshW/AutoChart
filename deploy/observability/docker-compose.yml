services:
  prometheus:
    image: docker.io/prom/prometheus:v3.1.0
    container_name: autochart-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:11.4.0
    container_name: autochart-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Serve behind a reverse proxy. Two configurations:
      #   - Direct access:   GF_PROXY_SUBPATH=/    (default)
      #   - Behind FastAPI:  GF_PROXY_SUBPATH=/proxy/8000/grafana/
      # The FastAPI backend proxies /grafana/* here when
      # AUTOCHART_GRAFANA_UPSTREAM=http://127.0.0.1:3000 is set.
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s${GF_PROXY_SUBPATH:-/}"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro,z
    depends_on:
      - prometheus
    restart: unless-stopped
