services:
  autochart:
    build:
      context: .
      dockerfile: Dockerfile
    image: autochart:local
    ports:
      - "8000:8000"
    environment:
      AUTOCHART_HOST: 0.0.0.0
      AUTOCHART_PORT: 8000
      AUTOCHART_ALLOWED_ORIGINS: ${AUTOCHART_ALLOWED_ORIGINS:-http://localhost:8000}
      AUTOCHART_API_KEY: ${AUTOCHART_API_KEY:-}
      AUTOCHART_LOG_LEVEL: ${AUTOCHART_LOG_LEVEL:-INFO}
      AUTOCHART_LOG_JSON: ${AUTOCHART_LOG_JSON:-1}
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
