name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.1"
      - name: Set up Python
        run: uv python install 3.13
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Ruff (lint)
        run: uv run ruff check src tests
      - name: Ruff (format)
        run: uv run ruff format --check src tests
      - name: Mypy
        run: uv run mypy
      - name: Pytest + coverage
        run: uv run pytest
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: .coverage
          if-no-files-found: ignore

  frontend:
    name: Frontend (eslint, vitest, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build

  security:
    name: Security (runtime dependency policy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.1"

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync runtime dependencies
        run: uv sync --frozen --no-dev

      - name: Python runtime dependency scan (fail on any known vulnerability)
        run: uvx --from pip-audit pip-audit

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: npm runtime audit (fail on high/critical)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: npm full-tree audit (warn on moderate+)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=moderate

  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    needs: [backend, frontend, security]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: autochart:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
